version: 2
updates:
- package-ecosystem: pip
  directory: "/"
  schedule:
    interval: weekly
    time: "00:00"
  open-pull-requests-limit: 0   # TASK-4011 (D11b): fork = alerts only, no version-update PRs
  labels:
  - dependencies
  ignore:
  - dependency-name: django
    versions:
    - "<= 5.0"
