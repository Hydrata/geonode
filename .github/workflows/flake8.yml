name: "Code formatting"

on:
  push:
    branches: [ master, 4.*, 5.x ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ master, 4.*, 5.x ]

permissions:
  contents: read

jobs:
  validate:

    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.12']

    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]'}}

    steps:
    - name: Checkout repository
      uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

    - name: Set up Python ${{matrix.python-version}}
      uses: actions/setup-python@e9aba2c848f5ebd159c070c61ea2c4e2b122355e # v2
      with:
        python-version: ${{matrix.python-version}}

    - name: Install flake8 & black
      run: pip install --upgrade $(grep 'flake8\|black' requirements.txt)

    - name: "Check: flake8"
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 geonode --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 geonode --count --statistics

    - name: "Check: black"
      # extend-exclude skips upstream files that don't pass black on 5.x
      run: black --check geonode --extend-exclude "geonode/(documents/tasks|thumbs/utils|settings)\.py"
